name: Validate portfolio source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/project-details.js
          node --check assets/js/projects.js
          node --check assets/js/translations.js
          node --check assets/js/particle-field.js
          node --check assets/js/contact-menu.js
