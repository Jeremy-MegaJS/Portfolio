name: Validate portfolio source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check main.js
        run: node --check assets/js/main.js
      - name: Check project-details.js
        run: node --check assets/js/project-details.js
      - name: Check projects.js
        run: node --check assets/js/projects.js
      - name: Check translations.js
        run: node --check assets/js/translations.js
      - name: Check contact-form.js
        run: node --check assets/js/contact-form.js
      - name: Check subpages.js
        run: node --check assets/js/subpages.js
      - name: Check navigation.js
        run: node --check assets/js/navigation.js
      - name: Check ambient-pixels.js
        run: node --check assets/js/ambient-pixels.js
